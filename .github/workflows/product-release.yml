name: Product release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:lint
      - run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_NAME: AI Receptionist Pro
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          ANTHROPIC_MODEL_PRIMARY: placeholder
          ANTHROPIC_MODEL_FAST: placeholder
          STRIPE_SECRET_KEY: placeholder
          STRIPE_WEBHOOK_SECRET: placeholder
          DIALOG360_API_KEY: placeholder
          DIALOG360_WEBHOOK_SECRET: placeholder
          ELEVENLABS_API_KEY: placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          INTERNAL_JOB_SECRET: placeholder
          CRON_SECRET: placeholder
      - name: Docker build
        run: docker build --tag ai-receptionist-pro:ci .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and E2E suite
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_NAME: AI Receptionist Pro
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          ANTHROPIC_MODEL_PRIMARY: placeholder
          ANTHROPIC_MODEL_FAST: placeholder
          STRIPE_SECRET_KEY: placeholder
          STRIPE_WEBHOOK_SECRET: placeholder
          DIALOG360_API_KEY: placeholder
          DIALOG360_WEBHOOK_SECRET: placeholder
          ELEVENLABS_API_KEY: placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          INTERNAL_JOB_SECRET: placeholder
          CRON_SECRET: placeholder

# Final release gate: dependency, secret, build, Docker, and browser checks.
