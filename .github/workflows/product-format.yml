name: Product formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-product-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format productized files
        run: |
          npx prettier --write \
            package.json \
            .github/workflows/product-release.yml \
            src/components/marketing/HeroSection.tsx \
            src/components/marketing/FeaturesSection.tsx \
            src/components/marketing/HowItWorksSection.tsx \
            src/components/marketing/VerticalsSection.tsx \
            src/components/marketing/CtaSection.tsx \
            src/components/marketing/JsonLd.tsx \
            src/components/marketing/PricingTeaser.tsx \
            src/components/marketing/SiteHeader.tsx \
            src/app/pricing/page.tsx \
            src/app/verticali/page.tsx \
            'src/app/verticali/[slug]/page.tsx' \
            'src/app/verticali/[slug]/verticals-data.ts' \
            'src/app/(dashboard)/settings/page.tsx' \
            src/components/onboarding/OnboardingForm.tsx \
            supabase/migrations/202609130003_product_defaults.sql
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json .github/workflows/product-release.yml src supabase/migrations/202609130003_product_defaults.sql
          git commit -m 'Format productized source files'
          git push
